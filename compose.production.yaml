# Single-machine production deployment.
#
#   echo "AUTH_SECRET=$(openssl rand -base64 32)" >> .env   # once, on first deploy
#   docker compose -f compose.production.yaml up -d --build
#
# AUTH_SECRET encrypts agent bearer/header credentials stored in Postgres —
# it must stay the same across restarts or those credentials become unreadable.
# Optional overrides (env or .env next to this file):
# POSTGRES_PASSWORD, APP_PORT, NPM_REGISTRY (npm mirror used at build time).

name: eve-chats-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eve_chats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_chats}
      POSTGRES_DB: eve_chats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_chats -d eve_chats"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrate
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://eve_chats:${POSTGRES_PASSWORD:-eve_chats}@postgres:5432/eve_chats
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://eve_chats:${POSTGRES_PASSWORD:-eve_chats}@postgres:5432/eve_chats
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — put it in .env next to this compose file}
    ports:
      - "${APP_PORT:-3010}:3010"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
