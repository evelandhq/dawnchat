# Single-machine production deployment.
#
#   echo "AUTH_SECRET=$(openssl rand -base64 32)" >> .env   # once, on first deploy
#   docker compose -f compose.production.yaml up -d --build
#
# AUTH_SECRET encrypts agent bearer/header credentials stored in Postgres —
# it must stay the same across restarts or those credentials become unreadable.
# Optional overrides (env or .env next to this file):
# POSTGRES_PASSWORD, APP_PORT, NPM_REGISTRY (npm mirror used at build time),
# EVELAND_IDENTITY_URL, EVELAND_IDENTITY_INTERNAL_URL, and
# EVELAND_IDENTITY_ISSUER.

# Keep the legacy Compose project name so upgrades continue to attach the
# existing production volume after the Dawn rename.
name: eve-chats-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eve_chats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_chats}
      POSTGRES_DB: eve_chats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_chats -d eve_chats"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrate
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://eve_chats:${POSTGRES_PASSWORD:-eve_chats}@postgres:5432/eve_chats
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NEXT_PUBLIC_EVELAND_IDENTITY_URL: ${EVELAND_IDENTITY_URL:?EVELAND_IDENTITY_URL is required}
        NEXT_PUBLIC_EVELAND_IDENTITY_RETURN_TARGET: ${EVELAND_IDENTITY_RETURN_TARGET:-eve-chats}
        # Base the server itself uses for the /identity rewrite and for reading
        # the Agent Catalog. It carries the Dockerfile's name, not this file's,
        # because EVELAND_IDENTITY_URL above reaches the browser and therefore
        # has to stay publicly routable. Empty falls back to the issuer.
        EVELAND_IDENTITY_URL: ${EVELAND_IDENTITY_INTERNAL_URL:-}
    restart: unless-stopped
    # Lets an EVELAND_IDENTITY_INTERNAL_URL of http://host.docker.internal:<port>
    # reach an identity service on the host when the public identity host is
    # not routable from inside the box (hairpin).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://eve_chats:${POSTGRES_PASSWORD:-eve_chats}@postgres:5432/eve_chats
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — put it in .env next to this compose file}
      EVELAND_IDENTITY_ISSUER: ${EVELAND_IDENTITY_ISSUER:?EVELAND_IDENTITY_ISSUER is required}
      EVELAND_IDENTITY_JWKS_URL: ${EVELAND_IDENTITY_JWKS_URL:?EVELAND_IDENTITY_JWKS_URL is required}
    ports:
      - "${APP_PORT:-3010}:3010"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
