autoInstallPeers: false
# Runtime and test peers are declared explicitly so optional database drivers
# such as better-sqlite3 are not installed automatically.
allowBuilds:
  # Required by Vitest/Vite tooling and transitive build-time bundling.
  esbuild: true
  # Native image dependency used by Next.js image optimization when present.
  sharp: true
minimumReleaseAgeExclude:
  # The client library is pinned to the newest verified release of the support
  # window Eveland hosts: Eve 0.44.x through 0.45.x agents.
  - eve@0.44.3 || 0.45.0
  - '@ai-sdk/gateway@4.0.61'
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - ai@7.0.76
  - next@16.3.2
  - shadcn@4.19.0
