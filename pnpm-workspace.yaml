autoInstallPeers: false
# Runtime and test peers are declared explicitly so optional database drivers
# such as better-sqlite3 are not installed automatically.
allowBuilds:
  # Required by Vitest/Vite tooling and transitive build-time bundling.
  esbuild: true
  # Native image dependency used by Next.js image optimization when present.
  sharp: true
minimumReleaseAgeExclude:
  # Eve is pinned to the version verified for the default HTTP API contract.
  - eve@0.22.1
