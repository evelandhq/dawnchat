services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eve_chats
      POSTGRES_PASSWORD: eve_chats
      POSTGRES_DB: eve_chats
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_chats -d eve_chats"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      # Keep the legacy volume name so existing local conversations survive
      # the Dawn rename.
      - eve-chats-postgres-data:/var/lib/postgresql/data

volumes:
  eve-chats-postgres-data:
